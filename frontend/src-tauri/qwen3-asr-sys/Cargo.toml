[package]
name = "qwen3-asr-sys"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "FFI bindings for qwen3-asr.cpp (GGML-based Qwen3 ASR)"
publish = false

[features]
default = ["cpu"]
cpu = []
metal = []
cuda = []
# Opt-in: clone and build the qwen3-asr.cpp vendor library (pinned commit).
# Without this feature the crate compiles a stub wrapper only and the engine
# reports itself unavailable at runtime.
vendor = []

[build-dependencies]
cc = "1.0"
cmake = "0.1"

[dependencies]
