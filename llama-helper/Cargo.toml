[package]
name = "llama-helper"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
llama-cpp-2 = "=0.1.146"
# llama-cpp-2 declares ^0.1.146 on its sys crate, but sys 0.1.147+ renamed the
# FFI surface (llama_rs_* prefix) and breaks the 0.1.146 wrapper. No Cargo.lock
# is committed for this sidecar, so CI resolves fresh — keep both pinned in
# lockstep.
llama-cpp-sys-2 = "=0.1.146"
encoding_rs = "0.8"

[features]
default = []
metal = ["llama-cpp-2/metal"]
cuda = ["llama-cpp-2/cuda"]
vulkan = ["llama-cpp-2/vulkan"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"  # Optimize for size for faster loading
